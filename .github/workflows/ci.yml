name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  BUILD_DEPS: >-
    base-devel git cmake extra-cmake-modules ninja clang
    qt6-base qt6-declarative kirigami kirigami-addons ki18n kconfig kcoreaddons kdbusaddons knotifications kstatusnotifieritem qqc2-desktop-style systemd-libs
    appstream desktop-file-utils
  # The archlinux image lists two mirrors only, and the first one dropped
  # downloads in CI; pacman moves on to these, and the install is retried.
  MIRRORS: >-
    https://mirrors.kernel.org/archlinux
    https://mirror.rackspace.com/archlinux

jobs:
  build:
    name: Build and test (${{ matrix.preset }})
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan]
    steps:
      - name: Install dependencies
        run: |
          printf 'Server = %s/$repo/os/$arch\n' $MIRRORS >> /etc/pacman.d/mirrorlist
          for attempt in 1 2 3; do
            pacman -Syu --noconfirm --needed $BUILD_DEPS && break
            [ "$attempt" -lt 3 ] && sleep 30
          done
          pacman -T $BUILD_DEPS > /dev/null
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Check formatting
        if: matrix.preset == 'debug'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake --build --preset debug --target clang-format
          git diff --exit-code

  package:
    name: PKGBUILD
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          printf 'Server = %s/$repo/os/$arch\n' $MIRRORS >> /etc/pacman.d/mirrorlist
          for attempt in 1 2 3; do
            pacman -Syu --noconfirm --needed $BUILD_DEPS && break
            [ "$attempt" -lt 3 ] && sleep 30
          done
          pacman -T $BUILD_DEPS > /dev/null
      - uses: actions/checkout@v5
      - name: Build the package as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging' && makepkg --noconfirm"

  reuse:
    name: REUSE
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install reuse
        run: |
          printf 'Server = %s/$repo/os/$arch\n' $MIRRORS >> /etc/pacman.d/mirrorlist
          for attempt in 1 2 3; do
            pacman -Syu --noconfirm --needed git reuse && break
            [ "$attempt" -lt 3 ] && sleep 30
          done
          pacman -T git reuse > /dev/null
      - uses: actions/checkout@v5
      - name: Lint licensing
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          reuse lint
